name: Fetch public-domain images and open fonts

# Downloads the images listed in assets/sources.txt into assets/source/
# and commits them, so the site keeps its own copies.
on:
  push:
    paths: ['assets/sources.txt']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p assets/source
          while read -r name url; do
            case "$name" in ''|\#*) continue;; esac
            case "$url" in met:*)
              url=$(curl -fsSL --retry 3 "https://collectionapi.metmuseum.org/public/collection/v1/objects/${url#met:}" | jq -r '.primaryImage') ;;
            esac
            case "$name" in */*) dest="assets/$name" ;; *) dest="assets/source/$name" ;; esac
            [ -f "$dest" ] && continue
            mkdir -p "$(dirname "$dest")"
            curl -fsSL --retry 3 -A "ValveFinder/1.0 (https://github.com/lordfran28/Valve-Finder)" -o "$dest" "$url" && echo "ok $dest" || echo "FAILED $dest"
          done < assets/sources.txt
          ls -la assets/source
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Download public-domain images"
          git push
