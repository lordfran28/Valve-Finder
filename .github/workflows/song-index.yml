name: Song list

on:
  push:
    branches: [main]
    paths: ["songs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: song-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: List the songs
        run: python3 .github/scripts/song_index.py
      - name: Save the list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs/index.json
          if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
          git commit -m "Update the song list"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
